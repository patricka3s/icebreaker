<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Icebreaker — live connections</title>
<script>
  /* ============================================================
     CONFIG — must match the value in index.html
     ============================================================ */
  const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwbsmfOpMcKAv4FMsuDupCPBmzg4OO4YZMFbCmllBE1C9r7bcEYW7GY_pr6rFUFgf5n1A/exec";
  const POLL_MS = 4000;
  const QUESTION_LABELS = [
    "Q1 · Hobby", "Q2 · Nerd out", "Q3 · Hidden skill", "Q4 · Curious", "Q5 · Next trip",
    "Q6 · Ketchup on eggs", "Q7 · Brownie debate", "Q8 · Cold spaghetti", "Q9 · Friends debate",
    "Q10 · AI thank-you notes", "Q11 · Stranger Things", "Q12 · Laundry debate", "Q13 · Tea debate",
    "Q14 · Comic Sans", "Q15 · Cat or dog", "Q16 · Clown or goat", "Q17 · Rhymes or riddles",
    "Q18 · Pancakes or pudding", "Q19 · Burp or fart", "Q20 · Noodle hair"
  ];
  const FEED_TEMPLATES = {
    "Q1 · Hobby": (n, a) => `${n}'s hobby: ${a}.`,
    "Q2 · Nerd out": (n, a) => `${n} wants to nerd out about ${a}.`,
    "Q3 · Hidden skill": (n, a) => `${n}'s hidden skill: ${a}.`,
    "Q4 · Curious": (n, a) => `${n} is curious about ${a}.`,
    "Q5 · Next trip": (n, a) => `${n} wants to travel to ${a}.`,
    "Q6 · Ketchup on eggs": (n, a) => a === "Yes" ? `${n} says yes to ketchup on eggs.` : `${n} says no to ketchup on eggs.`,
    "Q7 · Brownie debate": (n, a) => `${n} prefers ${a.toLowerCase()} in a brownie.`,
    "Q8 · Cold spaghetti": (n, a) => a.startsWith("Yes") ? `${n} says cold spaghetti is delicious.` : `${n} says cold spaghetti ruins it.`,
    "Q9 · Friends debate": (n, a) => `${n} says the true star of Friends is ${a}.`,
    "Q10 · AI thank-you notes": (n, a) => a.startsWith("Yes") ? `${n} thinks AI thank-you notes are fine.` : `${n} thinks AI thank-you notes are too impersonal.`,
    "Q11 · Stranger Things": (n, a) => a.startsWith("Yes") ? `${n} thinks Stranger Things is overrated.` : `${n} thinks Stranger Things is great.`,
    "Q12 · Laundry debate": (n, a) => `${n} likes to ${a.toLowerCase()} when doing laundry.`,
    "Q13 · Tea debate": (n, a) => `${n} puts milk in ${a.toLowerCase()} the tea.`,
    "Q14 · Comic Sans": (n, a) => `${n} thinks Comic Sans is ${a.toLowerCase()}.`,
    "Q15 · Cat or dog": (n, a) => `${n} is a ${a.toLowerCase()} person.`,
    "Q16 · Clown or goat": (n, a) => a === "Clown follows me" ? `${n} would rather always have a clown following them.` : `${n} would rather laugh like a goat forever.`,
    "Q17 · Rhymes or riddles": (n, a) => `${n} would rather talk in ${a.toLowerCase()}.`,
    "Q18 · Pancakes or pudding": (n, a) => `${n} would rather ${a.toLowerCase()}.`,
    "Q19 · Burp or fart": (n, a) => `${n} would rather ${a.toLowerCase()}.`,
    "Q20 · Noodle hair": (n, a) => `${n} would rather have ${a.toLowerCase()}.`,
  };
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

    margin: 0; padding: 0; min-height: 100vh;

  }

  .status.live { color: #3B82D8; }
  .style-row { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: #8891A7; margin: 0 0 18px; }
  .panels { display: flex; gap: 20px; flex-wrap: wrap; }

    background: transparent; color: #8891A7; border: 1px solid #1E3A5F; border-radius: 999px;

  }

  .panel:fullscreen { background: #0A1A33; padding: 30px; display: flex; flex-direction: column; justify-content: center; }
  .panel:-webkit-full-screen { background: #0A1A33; padding: 30px; display: flex; flex-direction: column; justify-content: center; }

    padding: 4px 8px; font-size: 11.5px; font-family: 'IBM Plex Mono', monospace;
  }
  .variety-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; margin: 28px 0 14px; }
  .variety-panels { display: flex; flex-direction: column; gap: 22px; background: #122845; border: 1px solid #1E3A5F; border-radius: 14px; padding: 20px 24px; }
  .variety-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .variety-head span:first-child { font-size: 13.5px; font-weight: 500; color: #E8ECF4; }
  .variety-head span:last-child { font-size: 11.5px; color: #5B6478; }
  .variety-row { display: flex; align-items: center; gap: 8px; padding: 2.5px 0; }

  .filter-menu-actions button {
    background: transparent; border: none; color: #3B82D8; font-size: 11px; cursor: pointer; padding: 0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .filter-menu label {
    display: flex; align-items: center; gap: 7px; padding: 4px 6px; font-size: 12px; color: #E8ECF4;
    cursor: pointer; border-radius: 4px;
  }
  .filter-menu label:hover { background: #122845; }
</style>

<body>
<div class="wrap">
  <h1>Live connections</h1>
  <p class="status" id="status">Connecting…</p>
  <div class="style-row">
    <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:2px;background:#5B6478;display:inline-block"></span>same answer</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:0;border-top:2px dashed #5B6478;display:inline-block"></span>shared keyword only</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="pause-toggle" checked />
      Pause live updates
    </label>
    <label style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="weak-toggle" />
      Show loose matches
    </label>
  </div>

  <div class="panels">
    <div class="panel" id="panel-interests">
      <div class="panel-head">
        <h2>Interests</h2>
        <button class="expand-btn" data-panel="panel-interests">Expand</button>
      </div>
      <div class="legend" id="legend-interests"></div>
      <svg id="graph-interests" viewBox="0 0 640 520"></svg>
      <p class="empty" id="empty-interests" style="display:none">No responses yet.</p>
    </div>
    <div class="panel" id="panel-debates">
      <div class="panel-head">
        <h2>Debates</h2>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="filter-dropdown" id="debate-filter-wrap">
            <button class="filter-select" id="debate-filter-btn">All debates ▾</button>
            <div class="filter-menu hidden" id="debate-filter-menu"></div>
          </div>
          <button class="expand-btn" data-panel="panel-debates">Expand</button>
        </div>
      </div>
      <div class="legend" id="legend-debates"></div>
      <svg id="graph-debates" viewBox="0 0 640 520"></svg>
      <p class="empty" id="empty-debates" style="display:none">No responses yet.</p>
    </div>
  </div>

  <div class="variety-title">Answer variety — interests</div>
  <div class="variety-panels" id="variety"></div>

  <div class="feed-title">Response feed</div>
  <div class="feed" id="feed"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
  const CLUSTER_COLORS = ["#639922","#E24B4A","#378ADD","#7F77DD","#D4537E","#1D9E75","#BA7517","#D85A30"];
  const OTHER = "#5B6478";
  const STOPWORDS = new Set(["the","a","an","and","of","to","in","on","with","your","you","can","do","my","every","for"]);
  let jsonpCounter = 0;
  let lastRows = [];
  let paused = true;
  const debateLabels = QUESTION_LABELS.slice(5);
  let debateFilterSet = new Set(debateLabels); // all selected = no filter applied

  const filterBtn = document.getElementById("debate-filter-btn");
  const filterMenu = document.getElementById("debate-filter-menu");
  filterMenu.innerHTML = `
    <div class="filter-menu-actions">
      <button type="button" id="filter-select-all">Select all</button>
      <button type="button" id="filter-select-none">Clear</button>
    </div>` +
    debateLabels.map((q) => `<label><input type="checkbox" value="${q}" checked /> ${q.split(" · ")[1]}</label>`).join("");

  function syncFilterButtonLabel() {
    const n = debateFilterSet.size;
    filterBtn.textContent = (n === 0 || n === debateLabels.length)
      ? "All debates ▾" : `${n} debate${n === 1 ? "" : "s"} selected ▾`;
  }

  filterMenu.querySelectorAll('input[type="checkbox"]').forEach((cb) => {
    cb.addEventListener("change", () => {
      debateFilterSet = new Set(
        [...filterMenu.querySelectorAll('input[type="checkbox"]:checked')].map((el) => el.value)
      );
      syncFilterButtonLabel();
      render(lastRows);
    });
  });
  document.getElementById("filter-select-all").addEventListener("click", () => {
    filterMenu.querySelectorAll('input[type="checkbox"]').forEach((cb) => (cb.checked = true));
    debateFilterSet = new Set(debateLabels);
    syncFilterButtonLabel();
    render(lastRows);
  });
  document.getElementById("filter-select-none").addEventListener("click", () => {
    filterMenu.querySelectorAll('input[type="checkbox"]').forEach((cb) => (cb.checked = false));
    debateFilterSet = new Set();
    syncFilterButtonLabel();
    render(lastRows);
  });
  filterBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    filterMenu.classList.toggle("hidden");
  });
  document.addEventListener("click", (e) => {
    if (!document.getElementById("debate-filter-wrap").contains(e.target)) filterMenu.classList.add("hidden");
  });

  const GROUPS = {
    interests: { questions: QUESTION_LABELS.slice(0, 5), svg: "graph-interests", legend: "legend-interests", empty: "empty-interests", sim: null },
    debates: { questions: QUESTION_LABELS.slice(5), svg: "graph-debates", legend: "legend-debates", empty: "empty-debates", sim: null },
  };

  function fetchJsonp() {
    return new Promise((resolve, reject) => {
      const cb = "sm_cb_" + (jsonpCounter++);
      const script = document.createElement("script");
      window[cb] = (data) => {
        resolve(data);
        delete window[cb];
        script.remove();
      };
      script.src = SHEET_WEBHOOK_URL + "?callback=" + cb + "&t=" + Date.now();
      script.onerror = () => reject(new Error("load failed"));
      document.body.appendChild(script);
    });
  }

  function normalize(s) {
    return (s || "").toLowerCase().trim().replace(/[.!?,'"]+$/g, "").replace(/\s+/g, " ");
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function renderFeed(rows) {
    const feedEl = document.getElementById("feed");
    feedEl.innerHTML = rows.slice().reverse().map((r) => {
      const tmpl = FEED_TEMPLATES[r.question];
      const sentence = tmpl ? tmpl(r.name, r.answer) : `${r.name}: ${r.answer}`;
      const rest = sentence.startsWith(r.name) ? sentence.slice(r.name.length) : ` ${sentence}`;
      return `<div class="feed-item"><span class="name">${escapeHtml(r.name)}</span>${escapeHtml(rest)}</div>`;
    }).join("");
    feedEl.scrollTop = 0;
  }

  function renderGroup(byPerson, groupKey) {
    const g = GROUPS[groupKey];
    const activeDebateSet = debateFilterSet.size ? debateFilterSet : new Set(debateLabels);
    const questions = groupKey === "debates" ? g.questions.filter((q) => activeDebateSet.has(q)) : g.questions;
    const names = Object.keys(byPerson).filter((n) => questions.some((q) => byPerson[n][q]));
    document.getElementById(g.empty).style.display = names.length ? "none" : "block";
    if (!names.length) {
      d3.select("#" + g.svg).selectAll("*").remove();
      document.getElementById(g.legend).innerHTML = "";
      return;
    }

    const nodes = names.map((n) => ({ id: n }));
    const strong = [];
    questions.forEach((q) => {
      const groups = {};
      names.forEach((n) => {
        const raw = byPerson[n][q];
        if (!raw) return;
        const key = normalize(raw);
        (groups[key] = groups[key] || { label: raw, members: [] }).members.push(n);
      });
      Object.values(groups).forEach((grp) => {
        if (grp.members.length > 1) {
          for (let i = 0; i < grp.members.length; i++)
            for (let j = i + 1; j < grp.members.length; j++)
              strong.push({ source: grp.members[i], target: grp.members[j], label: grp.label });
        }
      });
    });

    const wordIndex = {};
    names.forEach((n) => {
      questions.forEach((q) => {
        const raw = byPerson[n][q];
        if (!raw) return;
        normalize(raw).split(" ").forEach((w) => {
          if (w.length >= 5 && !STOPWORDS.has(w)) {
            wordIndex[w] = wordIndex[w] || new Map();
            if (!wordIndex[w].has(n)) wordIndex[w].set(n, { answer: raw, question: q });
          }
        });
      });
    });
    const weak = [];
    Object.entries(wordIndex).forEach(([word, map]) => {
      const members = [...map.keys()];
      if (members.length < 2) return;
      for (let i = 0; i < members.length; i++)
        for (let j = i + 1; j < members.length; j++) {
          const already = strong.some((e) =>
            [e.source, e.target].sort().join("|") === [members[i], members[j]].sort().join("|") &&
            e.label.toLowerCase().includes(word)
          );
          if (!already) weak.push({
            source: members[i], target: members[j], label: word,
            infoA: map.get(members[i]), infoB: map.get(members[j]),
          });
        }
    });

    const clusterSize = {};
    strong.forEach((e) => { clusterSize[e.label] = (clusterSize[e.label] || 0) + 1; });
    const rankedTopics = Object.entries(clusterSize).sort((a, b) => b[1] - a[1]).map(([t]) => t);
    const topicColor = {};
    rankedTopics.slice(0, CLUSTER_COLORS.length).forEach((t, i) => { topicColor[t] = CLUSTER_COLORS[i]; });
    strong.forEach((e) => { e.color = topicColor[e.label] || OTHER; });

    const clusterMembers = {};
    rankedTopics.forEach((t) => {
      clusterMembers[t] = new Set(strong.filter((e) => e.label === t).flatMap((e) => [e.source, e.target]));
    });

    function nodeFill(name) {
      const memberships = rankedTopics
        .filter((t) => clusterMembers[t].has(name))
        .map((t) => ({ topic: t, color: topicColor[t] || OTHER, size: clusterMembers[t].size }))
        .sort((a, b) => b.size - a.size);
      if (!memberships.length) return { type: "solid", color: OTHER };
      if (memberships.length > 1 && memberships[0].size - memberships[1].size <= 1)
        return { type: "stripe", colorA: memberships[0].color, colorB: memberships[1].color };
      return { type: "solid", color: memberships[0].color };
    }

    document.getElementById(g.legend).innerHTML = rankedTopics.slice(0, CLUSTER_COLORS.length).map((t, i) =>
      `<span><span class="dot" style="background:${CLUSTER_COLORS[i]}"></span>${t}</span>`
    ).join("") + (rankedTopics.length > CLUSTER_COLORS.length
      ? `<span><span class="dot" style="background:${OTHER}"></span>other matches</span>` : "");

    const degree = {};
    strong.forEach((e) => { degree[e.source] = (degree[e.source] || 0) + 1; degree[e.target] = (degree[e.target] || 0) + 1; });

    const svg = d3.select("#" + g.svg);
    svg.selectAll("*").remove();
    const defs = svg.append("defs");
    const W = 640, H = 520;

    const link = svg.append("g").selectAll("line").data(strong).join("line")
      .attr("stroke", (d) => d.color).attr("stroke-width", 2).attr("opacity", 0.75);
    link.append("title").text((d) => `${d.source} & ${d.target}: "${d.label}"`);

    const weakLinkG = svg.append("g")
      .style("display", document.getElementById("weak-toggle").checked ? null : "none");
    const weakLink = weakLinkG.selectAll("line").data(weak).join("line")
      .attr("stroke", OTHER).attr("stroke-width", 1).attr("stroke-dasharray", "3,3").attr("opacity", 0.45);
    weakLink.append("title").text((d) =>
      `${d.source}: "${d.infoA.answer}" (${d.infoA.question.split(" · ")[1]})\n` +
      `${d.target}: "${d.infoB.answer}" (${d.infoB.question.split(" · ")[1]})\n` +
      `shared word: ${d.label}`
    );
    const weakLabel = weakLinkG.selectAll("text").data(weak).join("text")
      .attr("font-size", "9.5px").attr("font-family", "IBM Plex Mono, monospace")
      .attr("fill", "#8891A7").attr("text-anchor", "middle")
      .attr("paint-order", "stroke").attr("stroke", "#122845").attr("stroke-width", 4).attr("stroke-linejoin", "round")
      .text((d) => d.label);
    weakLabel.append("title").text((d) =>
      `${d.source}: "${d.infoA.answer}" (${d.infoA.question.split(" · ")[1]})\n` +
      `${d.target}: "${d.infoB.answer}" (${d.infoB.question.split(" · ")[1]})\n` +
      `shared word: ${d.label}`
    );

    const node = svg.append("g").selectAll("g").data(nodes).join("g");
    node.append("circle")
      .attr("r", (d) => 7 + Math.min(degree[d.id] || 0, 6) * 1.5)
      .attr("fill", (d) => {
        const fill = nodeFill(d.id);
        if (fill.type === "solid") return fill.color;
        const pid = "stripe-" + groupKey + "-" + d.id.replace(/[^a-z0-9]/gi, "");
        defs.append("pattern").attr("id", pid).attr("width", 8).attr("height", 8)
          .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)")
          .html(`<rect width="8" height="8" fill="${fill.colorA}"/><rect width="4" height="8" fill="${fill.colorB}"/>`);
        return `url(#${pid})`;
      })
      .attr("stroke", "#122845").attr("stroke-width", 1.5);
    node.append("text").attr("text-anchor", "middle").attr("dy", -13)
      .attr("fill", "#8891A7").attr("font-size", "11px").attr("font-family", "IBM Plex Mono, monospace")
      .text((d) => d.id);
    node.append("title").text((d) => {
      const lines = questions
        .filter((q) => byPerson[d.id][q])
        .map((q) => `${q.split(" · ")[1]}: ${byPerson[d.id][q]}`);
      return [d.id, ...lines].join("\n");
    });

    if (g.sim) g.sim.stop();
    g.sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink([...strong, ...weak]).id((d) => d.id).distance((d) => strong.includes(d) ? 85 : 130).strength(0.5))
      .force("charge", d3.forceManyBody().strength(-260))
      .force("center", d3.forceCenter(W / 2, H / 2))
      .force("x", d3.forceX(W / 2).strength(0.04))
      .force("y", d3.forceY(H / 2).strength(0.04))
      .force("collide", d3.forceCollide((d) => 12 + Math.min(degree[d.id] || 0, 6) * 2));

    const PAD = 40;
    nodes.forEach((n) => { n.x = W / 2 + (Math.random() - 0.5) * 100; n.y = H / 2 + (Math.random() - 0.5) * 100; });

    g.sim.on("tick", () => {
      nodes.forEach((n) => {
        n.x = Math.max(PAD, Math.min(W - PAD, n.x));
        n.y = Math.max(PAD, Math.min(H - PAD, n.y));
      });
      link.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      weakLink.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
              .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      weakLabel.attr("x", (d) => (d.source.x + d.target.x) / 2)
               .attr("y", (d) => (d.source.y + d.target.y) / 2);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);
    });
  }

  function renderVariety(rows) {
    const container = document.getElementById("variety");
    const interestLabels = QUESTION_LABELS.slice(0, 5);
    container.innerHTML = interestLabels.map((q) => {
      const groups = {};
      rows.filter((r) => r.question === q).forEach((r) => {
        const key = normalize(r.answer);
        if (!key) return;
        groups[key] = groups[key] || { label: r.answer, count: 0 };
        groups[key].count++;
      });
      const sorted = Object.values(groups).sort((a, b) => b.count - a.count);
      if (!sorted.length) return "";
      const max = sorted[0].count;
      const rowsHtml = sorted.map((s) => {
        const pct = Math.round((s.count / max) * 100);
        return `<div class="variety-row">
          <span class="variety-label">${escapeHtml(s.label)}</span>
          <div class="variety-bar-track"><div class="variety-bar-fill" style="width:${pct}%"></div></div>
          <span class="variety-count">${s.count}</span>
        </div>`;
      }).join("");
      return `<div>
        <div class="variety-head"><span>${q.split(" · ")[1]}</span><span>${sorted.length} unique answers</span></div>
        ${rowsHtml}
      </div>`;
    }).join("");
  }

  function render(rows) {
    const byPerson = {};
    rows.forEach((r) => {
      byPerson[r.name] = byPerson[r.name] || {};
      byPerson[r.name][r.question] = r.answer;
    });
    renderFeed(rows);
    renderVariety(rows);
    renderGroup(byPerson, "interests");
    renderGroup(byPerson, "debates");
  }

  document.getElementById("weak-toggle").addEventListener("change", (e) => {
    ["graph-interests", "graph-debates"].forEach((svgId) => {
      d3.select("#" + svgId).selectAll("g").each(function () {
        const g = d3.select(this);
        if (g.selectAll("line[stroke-dasharray]").size() > 0) g.style("display", e.target.checked ? null : "none");
      });
    });
  });

  document.querySelectorAll(".expand-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const panel = document.getElementById(btn.dataset.panel);
      const isFull = document.fullscreenElement === panel || document.webkitFullscreenElement === panel;
      if (!isFull) {
        (panel.requestFullscreen || panel.webkitRequestFullscreen).call(panel);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    });
  });

  function syncExpandButtons() {
    const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
    document.querySelectorAll(".expand-btn").forEach((btn) => {
      const panel = document.getElementById(btn.dataset.panel);
      btn.textContent = fsEl === panel ? "Collapse" : "Expand";
    });
  }
  document.addEventListener("fullscreenchange", syncExpandButtons);
  document.addEventListener("webkitfullscreenchange", syncExpandButtons);

  document.getElementById("pause-toggle").addEventListener("change", (e) => {
    paused = e.target.checked;
    const statusEl = document.getElementById("status");
    if (paused) {
      statusEl.textContent = `Paused — showing ${lastRows.length} answers as of ${new Date().toLocaleTimeString()}`;
      statusEl.className = "status";
    } else {
      poll(true);
    }
  });

  async function poll(force) {
    if (paused && !force) return;
    const statusEl = document.getElementById("status");
    try {
      const data = await fetchJsonp();
      lastRows = data.rows || [];
      render(lastRows);
      if (paused) {
        statusEl.textContent = `Paused — showing ${lastRows.length} answers as of ${new Date().toLocaleTimeString()}`;
        statusEl.className = "status";
      } else {
        statusEl.textContent = `Live — ${lastRows.length} answers — updated ${new Date().toLocaleTimeString()}`;
        statusEl.className = "status live";
      }
    } catch (err) {
      statusEl.textContent = "Couldn't reach the sheet — check SHEET_WEBHOOK_URL in results.html";
      statusEl.className = "status";
    }
  }

  poll(true);
  setInterval(() => poll(false), POLL_MS);
</script>
</body>
</html>
