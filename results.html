<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Speed Match — live connections</title>
<script>
  /* ============================================================
     CONFIG — must match the value in index.html
     ============================================================ */
  const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwbsmfOpMcKAv4FMsuDupCPBmzg4OO4YZMFbCmllBE1C9r7bcEYW7GY_pr6rFUFgf5n1A/exec"; // ends in /exec
  const POLL_MS = 4000;
  const QUESTION_LABELS = ["Q1 · Hobby", "Q2 · Nerd out", "Q3 · Hidden skill", "Q4 · Curious", "Q5 · Next trip"];
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #0B1120; color: #E8ECF4;
    font-family: 'IBM Plex Mono', monospace;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;
    margin: 0 0 4px;
  }
  .status { font-size: 12.5px; color: #8891A7; margin: 0 0 18px; }
  .status.live { color: #4FD1C5; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: #8891A7; margin: 0 0 10px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .style-row { display: flex; align-items: center; gap: 16px; font-size: 12.5px; color: #8891A7; margin: 0 0 14px; }
  svg { width: 100%; height: auto; background: #131B2E; border: 1px solid #1F2A44; border-radius: 14px; }
  .empty { color: #5B6478; font-size: 13px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Live connections</h1>
  <p class="status" id="status">Connecting…</p>
  <div class="legend" id="legend"></div>
  <div class="style-row">
    <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:2px;background:#5B6478;display:inline-block"></span>same answer</span>
    <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:0;border-top:2px dashed #5B6478;display:inline-block"></span>shared keyword only</span>
    <label style="margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="weak-toggle" />
      Show loose matches
    </label>
  </div>
  <svg id="graph" viewBox="0 0 900 600"></svg>
  <p class="empty" id="empty" style="display:none">No responses yet — answers will appear here as people submit.</p>
</div>
 
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
  const CLUSTER_COLORS = ["#639922","#E24B4A","#378ADD","#7F77DD","#D4537E","#1D9E75","#BA7517","#D85A30"];
  const OTHER = "#5B6478";
  const STOPWORDS = new Set(["the","a","an","and","of","to","in","on","with","your","you","can","do","my","every","for"]);
  let jsonpCounter = 0;
 
  function fetchJsonp() {
    return new Promise((resolve, reject) => {
      const cb = "sm_cb_" + (jsonpCounter++);
      const script = document.createElement("script");
      window[cb] = (data) => {
        resolve(data);
        delete window[cb];
        script.remove();
      };
      script.src = SHEET_WEBHOOK_URL + "?callback=" + cb + "&t=" + Date.now();
      script.onerror = () => reject(new Error("load failed"));
      document.body.appendChild(script);
    });
  }
 
  function normalize(s) {
    return (s || "").toLowerCase().trim().replace(/[.!?,'"]+$/g, "").replace(/\s+/g, " ");
  }
 
  let sim = null;
 
  function render(rows) {
    const byPerson = {};
    rows.forEach((r) => {
      byPerson[r.name] = byPerson[r.name] || {};
      byPerson[r.name][r.question] = r.answer;
    });
    const names = Object.keys(byPerson);
    document.getElementById("empty").style.display = names.length ? "none" : "block";
    if (!names.length) {
      d3.select("#graph").selectAll("*").remove();
      return;
    }
 
    const nodes = names.map((n) => ({ id: n }));
    const strong = [];
    QUESTION_LABELS.forEach((q) => {
      const groups = {};
      names.forEach((n) => {
        const raw = byPerson[n][q];
        if (!raw) return;
        const key = normalize(raw);
        (groups[key] = groups[key] || { label: raw, members: [] }).members.push(n);
      });
      Object.values(groups).forEach((g) => {
        if (g.members.length > 1) {
          for (let i = 0; i < g.members.length; i++)
            for (let j = i + 1; j < g.members.length; j++)
              strong.push({ source: g.members[i], target: g.members[j], label: g.label });
        }
      });
    });
 
    // loose matches: shared significant words across different answers,
    // excluding anything already captured as a strong (exact-answer) match
    const wordIndex = {};
    names.forEach((n) => {
      Object.values(byPerson[n]).forEach((raw) => {
        normalize(raw).split(" ").forEach((w) => {
          if (w.length >= 5 && !STOPWORDS.has(w)) (wordIndex[w] = wordIndex[w] || new Set()).add(n);
        });
      });
    });
    const weak = [];
    Object.entries(wordIndex).forEach(([word, set]) => {
      const members = [...set];
      if (members.length < 2) return;
      for (let i = 0; i < members.length; i++)
        for (let j = i + 1; j < members.length; j++) {
          const already = strong.some((e) =>
            [e.source, e.target].sort().join("|") === [members[i], members[j]].sort().join("|") &&
            e.label.toLowerCase().includes(word)
          );
          if (!already) weak.push({ source: members[i], target: members[j], label: word });
        }
    });
 
    // rank clusters by size, biggest gets color 1
    const clusterSize = {};
    strong.forEach((e) => { clusterSize[e.label] = (clusterSize[e.label] || 0) + 1; });
    const rankedTopics = Object.entries(clusterSize).sort((a, b) => b[1] - a[1]).map(([t]) => t);
    const topicColor = {};
    rankedTopics.slice(0, CLUSTER_COLORS.length).forEach((t, i) => { topicColor[t] = CLUSTER_COLORS[i]; });
    strong.forEach((e) => { e.color = topicColor[e.label] || OTHER; });
 
    const clusterMembers = {};
    rankedTopics.forEach((t) => {
      clusterMembers[t] = new Set(strong.filter((e) => e.label === t).flatMap((e) => [e.source, e.target]));
    });
 
    function nodeFill(name) {
      const memberships = rankedTopics
        .filter((t) => clusterMembers[t].has(name))
        .map((t) => ({ topic: t, color: topicColor[t] || OTHER, size: clusterMembers[t].size }))
        .sort((a, b) => b.size - a.size);
      if (!memberships.length) return { type: "solid", color: OTHER };
      if (memberships.length > 1 && memberships[0].size - memberships[1].size <= 1)
        return { type: "stripe", colorA: memberships[0].color, colorB: memberships[1].color };
      return { type: "solid", color: memberships[0].color };
    }
 
    document.getElementById("legend").innerHTML = rankedTopics.slice(0, CLUSTER_COLORS.length).map((t, i) =>
      `<span><span class="dot" style="background:${CLUSTER_COLORS[i]}"></span>${t}</span>`
    ).join("") + (rankedTopics.length > CLUSTER_COLORS.length
      ? `<span><span class="dot" style="background:${OTHER}"></span>other matches</span>` : "");
 
    const degree = {};
    strong.forEach((e) => { degree[e.source] = (degree[e.source] || 0) + 1; degree[e.target] = (degree[e.target] || 0) + 1; });
 
    const svg = d3.select("#graph");
    svg.selectAll("*").remove();
    const defs = svg.append("defs");
    const W = 900, H = 600;
 
    const link = svg.append("g").selectAll("line").data(strong).join("line")
      .attr("stroke", (d) => d.color).attr("stroke-width", 2).attr("opacity", 0.75);
    link.append("title").text((d) => d.label);
 
    const weakLinkG = svg.append("g")
      .style("display", document.getElementById("weak-toggle").checked ? null : "none");
    const weakLink = weakLinkG.selectAll("line").data(weak).join("line")
      .attr("stroke", OTHER).attr("stroke-width", 1).attr("stroke-dasharray", "3,3").attr("opacity", 0.45);
    weakLink.append("title").text((d) => "shared word: " + d.label);
 
    const node = svg.append("g").selectAll("g").data(nodes).join("g");
    node.append("circle")
      .attr("r", (d) => 8 + Math.min(degree[d.id] || 0, 6) * 1.8)
      .attr("fill", (d) => {
        const fill = nodeFill(d.id);
        if (fill.type === "solid") return fill.color;
        const pid = "stripe-" + d.id.replace(/[^a-z0-9]/gi, "");
        defs.append("pattern").attr("id", pid).attr("width", 8).attr("height", 8)
          .attr("patternUnits", "userSpaceOnUse").attr("patternTransform", "rotate(45)")
          .html(`<rect width="8" height="8" fill="${fill.colorA}"/><rect width="4" height="8" fill="${fill.colorB}"/>`);
        return `url(#${pid})`;
      })
      .attr("stroke", "#131B2E").attr("stroke-width", 1.5);
    node.append("text").attr("text-anchor", "middle").attr("dy", -15)
      .attr("fill", "#8891A7").attr("font-size", "12px").attr("font-family", "IBM Plex Mono, monospace")
      .text((d) => d.id);
    node.append("title").text((d) => d.id);
 
    if (sim) sim.stop();
    sim = d3.forceSimulation(nodes)
      .force("link", d3.forceLink([...strong, ...weak]).id((d) => d.id).distance((d) => strong.includes(d) ? 80 : 140).strength(0.4))
      .force("charge", d3.forceManyBody().strength(-260))
      .force("center", d3.forceCenter(W / 2, H / 2))
      .force("collide", d3.forceCollide(34));
 
    sim.on("tick", () => {
      link.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      weakLink.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
              .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
      node.attr("transform", (d) => `translate(${d.x},${d.y})`);
    });
  }
 
  document.getElementById("weak-toggle").addEventListener("change", (e) => {
    d3.select("#graph").selectAll("g").each(function () {
      const g = d3.select(this);
      if (g.selectAll("line[stroke-dasharray]").size() > 0) g.style("display", e.target.checked ? null : "none");
    });
  });
 
  async function poll() {
    const statusEl = document.getElementById("status");
    try {
      const data = await fetchJsonp();
      render(data.rows || []);
      statusEl.textContent = `Live — ${data.rows.length} answers — updated ${new Date().toLocaleTimeString()}`;
      statusEl.className = "status live";
    } catch (err) {
      statusEl.textContent = "Couldn't reach the sheet — check SHEET_WEBHOOK_URL in results.html";
      statusEl.className = "status";
    }
  }
 
  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
